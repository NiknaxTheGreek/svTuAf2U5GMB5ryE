name: Targeted cross-split SSIM audit

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/targeted-cross-split-ssim.yml"
      - "scripts/targeted_cross_split_ssim.py"

permissions:
  contents: write

jobs:
  ssim:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow numpy imagehash scikit-image

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Run targeted SSIM confirmation
        run: |
          rm -rf raw_ssim_audit
          python scripts/targeted_cross_split_ssim.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --out-dir raw_ssim_audit

      - name: Commit SSIM outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_ssim_audit/
          if git diff --cached --quiet; then
            echo "No SSIM changes."
          else
            git commit -m "Record targeted cross-split SSIM audit"
            git push origin HEAD:raw-eda-scratch
          fi
