name: Evaluate frozen D1-D4 models once

on:
  push:
    branches: [raw-eda-scratch]
    paths:
      - "raw_final_models/final_refit_workflow.json"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow pandas scikit-learn
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax check
        run: python -m py_compile scripts/evaluate_d1_d4_frozen_models.py

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          echo "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f  data/images.zip" | sha256sum -c -
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Download exact frozen model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="$(python - <<'PY'
          import json
          print(json.load(open("raw_final_models/final_refit_workflow.json"))["workflow_run_id"])
          PY
          )"
          rm -rf frozen_models
          mkdir -p frozen_models
          gh run download "$RUN_ID" -n d1-d4-final-models -D frozen_models
          ls -lh frozen_models

      - name: Evaluate all four frozen models in one invocation
        run: |
          rm -rf raw_final_evaluation
          python scripts/evaluate_d1_d4_frozen_models.py \
            --dataset-root data/extracted \
            --archive data/images.zip \
            --models-dir frozen_models \
            --model-manifest raw_final_models/final_model_manifest.json \
            --protocol raw_model_selection/model_selection_protocol.json \
            --d2-manifest raw_d2_split/d2_frame_split_manifest.csv \
            --d3-manifest raw_d3_d4_split/d3_frame_manifest.csv \
            --d4-manifest raw_d3_d4_split/d4_frame_manifest.csv \
            --out-dir raw_final_evaluation
          cat raw_final_evaluation/final_d1_d4_evaluation.json
          cat raw_final_evaluation/final_evaluation_receipt.json

      - name: Commit final evaluation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_final_evaluation/
          if git diff --cached --quiet; then
            echo "No final-evaluation changes."
          else
            git commit -m "Record locked D1-D4 final evaluation"
            git pull --rebase origin raw-eda-scratch
            git push origin HEAD:raw-eda-scratch
          fi
