name: Validate and freeze Phase 4 baselines

on:
  push:
    branches: ["phase/04-baselines"]

permissions:
  contents: write

jobs:
  baseline-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install baseline-gate dependencies
        run: python -m pip install numpy==2.3.5 Pillow==12.3.0 PyYAML==6.0.3 scikit-learn==1.9.1 pytest==9.0.2 nbformat==5.10.4 nbclient==0.10.4 ipykernel==7.2.0
      - name: Download authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm&export=download&confirm=t"             --output /tmp/images.zip
          printf '%s  %s\n'             "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f"             "/tmp/images.zip" | sha256sum --check
      - name: Build verified handcrafted feature table
        run: |
          python -m scripts.build_handcrafted_features             --archive /tmp/images.zip             --output /tmp/generated/outputs/tables/DATA-001_handcrafted_features.csv
      - name: Run majority and logistic baselines
        run: |
          python -m scripts.run_baselines             --features /tmp/generated/outputs/tables/DATA-001_handcrafted_features.csv             --split manifests/splits/SPLIT-001_original.csv             --output-root /tmp/generated             --source-commit "${GITHUB_SHA}"
      - name: Independently validate baseline outputs
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          from pathlib import Path
          from src.evaluation import compute_binary_metrics
          from src.features import ALL_FEATURES, FEATURE_SETS

          root = Path("/tmp/generated")
          features = list(csv.DictReader((root / "outputs/tables/DATA-001_handcrafted_features.csv").open(newline="", encoding="utf-8")))
          assert len(features) == 2989
          assert len(ALL_FEATURES) == 62
          assert all(math.isfinite(float(row[name])) for row in features for name in ALL_FEATURES)

          tuning = list(csv.DictReader((root / "outputs/tables/baseline_tuning_membership.csv").open(newline="", encoding="utf-8")))
          assert len(tuning) == 2392
          assert sum(row["partition"] == "validation" for row in tuning) == 240
          assert sum(row["partition"] == "fit" for row in tuning) == 2152

          search = list(csv.DictReader((root / "outputs/tables/logistic_c_search.csv").open(newline="", encoding="utf-8")))
          assert len(search) == 27
          assert {row["feature_set"] for row in search} == {"A", "B", "C"}

          summary = json.loads((root / "outputs/metrics/baseline_summary.json").read_text(encoding="utf-8"))
          selected_set = summary["handcrafted_logistic"]["selected_feature_set"]
          assert selected_set in {"A", "B", "C"}
          assert summary["handcrafted_logistic"]["selected_C"] in summary["tuning"]["C_grid"]

          split_rows = list(csv.DictReader(open("manifests/splits/SPLIT-001_original.csv", newline="", encoding="utf-8")))
          expected_test = {row["sample_id"] for row in split_rows if row["partition"] == "test"}

          def check_prediction_file(path, expected_count, expected_ids=None):
              rows = list(csv.DictReader(path.open(newline="", encoding="utf-8")))
              assert len(rows) == expected_count
              if expected_ids is not None:
                  assert {row["sample_id"] for row in rows} == expected_ids
              y = [int(row["true_class"]) for row in rows]
              p = [float(row["probability_flip"]) for row in rows]
              return compute_binary_metrics(y, p)

          majority_test = check_prediction_file(
              root / "outputs/predictions/majority_original_test.csv", 597, expected_test
          )
          logistic_test = check_prediction_file(
              root / "outputs/predictions/handcrafted_logistic_original_test.csv", 597, expected_test
          )
          assert majority_test == summary["majority"]["test_metrics"]
          assert logistic_test == summary["handcrafted_logistic"]["test_metrics"]
          assert majority_test["threshold"] == 0.5
          assert logistic_test["threshold"] == 0.5

          coefficients = list(csv.DictReader((root / "outputs/tables/handcrafted_logistic_coefficients.csv").open(newline="", encoding="utf-8")))
          assert len(coefficients) == len(FEATURE_SETS[selected_set])
          print(json.dumps({
              "selected_feature_set": selected_set,
              "selected_C": summary["handcrafted_logistic"]["selected_C"],
              "majority_test_f1": majority_test["f1"],
              "logistic_test_f1": logistic_test["f1"],
          }, sort_keys=True))
          print("BASELINE_OUTPUT_VALIDATION=PASS")
          PY
      - name: Stage generated baseline artifacts
        run: |
          cp /tmp/generated/outputs/tables/DATA-001_handcrafted_features.csv outputs/tables/
          cp /tmp/generated/outputs/tables/baseline_tuning_membership.csv outputs/tables/
          cp /tmp/generated/outputs/tables/logistic_c_search.csv outputs/tables/
          cp /tmp/generated/outputs/tables/handcrafted_logistic_coefficients.csv outputs/tables/
          cp /tmp/generated/outputs/metrics/baseline_summary.json outputs/metrics/
          cp /tmp/generated/outputs/predictions/majority_original_validation.csv outputs/predictions/
          cp /tmp/generated/outputs/predictions/majority_original_test.csv outputs/predictions/
          cp /tmp/generated/outputs/predictions/handcrafted_logistic_original_validation.csv outputs/predictions/
          cp /tmp/generated/outputs/predictions/handcrafted_logistic_original_test.csv outputs/predictions/
      - name: Execute baseline notebook
        run: python -m scripts.execute_notebook notebooks/03_baselines.ipynb --in-place
      - name: Run baseline component tests
        run: python -m pytest -q tests/test_features.py tests/test_evaluation.py tests/test_training_logistic.py tests/test_baseline_membership.py
      - name: Upload baseline audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: monreader-phase4-baselines
          path: /tmp/generated
          if-no-files-found: error
          retention-days: 1
      - name: Freeze validated baseline artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/tables outputs/metrics outputs/predictions notebooks/03_baselines.ipynb
          if git diff --cached --quiet; then
            echo "No baseline artifact changes."
          else
            git commit -m "Freeze Phase 4 baseline artifacts [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
