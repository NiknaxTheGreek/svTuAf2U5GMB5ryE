name: MonReader V2 Phase 11C chroma counterfactual QA

on:
  push:
    branches: ["phase/v2-11c-chroma"]
    paths:
      - ".github/workflows/v2_phase11c_chroma_qa.yml"

permissions:
  contents: write

env:
  DATASET_FILE_ID: 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm
  DATASET_SHA256: 033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f
  PYTHONPATH: "."

jobs:
  chroma-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 Pillow==12.3.0

      - name: Compile frozen chroma QA
        run: |
          set -euo pipefail
          python -m compileall -q scripts/develop_chroma_counterfactual_v2.py

      - name: Download and verify authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=$DATASET_FILE_ID&export=download&confirm=t"             --output /tmp/images.zip
          printf '%s  %s\n' "$DATASET_SHA256" "/tmp/images.zip" | sha256sum --check

      - name: Run frozen context-only chroma QA
        run: |
          set -euo pipefail
          rm -rf /tmp/chroma-qa
          python -m scripts.develop_chroma_counterfactual_v2             --archive /tmp/images.zip             --manifest manifests/datasets/DATA-001.csv             --st-membership manifests/splits/ST.csv             --sample manifests/secondary/PHASE11B_POC_100.csv             --output-dir /tmp/chroma-qa
          sha256sum /tmp/chroma-qa/summary.json /tmp/chroma-qa/records.json /tmp/chroma-qa/qa/*

      - name: Upload full chroma QA evidence
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-phase11c-chroma-qa-100
          path: /tmp/chroma-qa
          compression-level: 1
          retention-days: 90
          if-no-files-found: error

      - name: Publish compact chroma QA evidence
        run: |
          set -euo pipefail
          mkdir -p results/secondary/chroma_qa_100
          cp /tmp/chroma-qa/summary.json results/secondary/chroma_qa_100/
          cp /tmp/chroma-qa/records.json results/secondary/chroma_qa_100/
          cp /tmp/chroma-qa/qa/*.review.jpg.b64.txt results/secondary/chroma_qa_100/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/secondary/chroma_qa_100
          git commit -m "Phase 11C: publish 100-image chroma QA [skip ci]"
          git fetch origin phase/v2-11c-chroma
          git rebase origin/phase/v2-11c-chroma
          git push origin HEAD:phase/v2-11c-chroma
