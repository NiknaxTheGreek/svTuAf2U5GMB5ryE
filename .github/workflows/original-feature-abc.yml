name: Original feature ABC analysis

on:
  push:
    branches: [raw-eda-scratch]
    paths:
      - "scripts/original_feature_abc.py"
      - ".github/workflows/original-feature-abc.yml"

permissions:
  contents: write

jobs:
  abc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy scikit-learn
      - name: Run A+B+C
        run: |
          rm -rf raw_feature_abc
          python scripts/original_feature_abc.py \
            --features-csv raw_visual_variability/original_visual_features.csv \
            --out-dir raw_feature_abc
      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_feature_abc/
          if git diff --cached --quiet; then
            echo "No ABC changes."
          else
            git commit -m "Record original visual feature ABC analysis"
            git pull --rebase origin raw-eda-scratch
            git push origin HEAD:raw-eda-scratch
          fi
