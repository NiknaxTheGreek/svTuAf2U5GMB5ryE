name: Phase 5 Stage 2 resume-safe Bayesian search

on:
  push:
    branches: ["phase/05-scratch-original"]

permissions:
  contents: write

jobs:
  stage2:
    if: github.actor != 'github-actions[bot]' && (github.event.head_commit.message == 'Execute Stage 2 Bayesian search' || github.event.head_commit.message == 'Resume Stage 2 Bayesian search')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install CPU execution dependencies
        run: |
          python -m pip install numpy==2.3.5 Pillow==12.3.0 PyYAML==6.0.3 scikit-learn==1.9.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
      - name: Verify frozen Stage-2 inputs
        run: |
          test -f outputs/metrics/scratch_stage1_results.json
          test -f configs/sweeps/scratch_stage2_bayesian.json
          python -m scripts.derive_scratch_stage2 \
            --stage1-results outputs/metrics/scratch_stage1_results.json \
            --output /tmp/rederived_stage2.json
          cmp /tmp/rederived_stage2.json configs/sweeps/scratch_stage2_bayesian.json
      - name: Download authoritative archive and build exact cache
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm&export=download&confirm=t" \
            --output /tmp/images.zip
          printf '%s  %s\n' \
            "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f" \
            "/tmp/images.zip" | sha256sum --check
          unzip -q /tmp/images.zip -d /tmp/monreader
          mkdir -p /tmp/cache
          python -m scripts.build_scratch_cache \
            --image-root /tmp/monreader \
            --output-data /tmp/cache/stage2_uint8.npy \
            --output-index /tmp/cache/stage2_index.csv
      - name: Execute or resume 30 sequential Bayesian trials
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          mkdir -p outputs/metrics/scratch_stage2_trials configs/sweeps/scratch_stage2_trials /tmp/checkpoints
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for iteration in $(seq 1 30); do
            printf -v trial_id "stage2-%03d" "${iteration}"
            result_path="outputs/metrics/scratch_stage2_trials/${trial_id}.json"
            config_path="configs/sweeps/scratch_stage2_trials/${trial_id}.json"

            if [ -f "${result_path}" ] && [ -f "${config_path}" ]; then
              echo "Skipping committed ${trial_id}"
              continue
            fi

            python -m scripts.propose_scratch_stage2 \
              --stage1-results outputs/metrics/scratch_stage1_results.json \
              --stage2-space configs/sweeps/scratch_stage2_bayesian.json \
              --prior-results-root outputs/metrics/scratch_stage2_trials \
              --iteration "${iteration}" \
              --output "${config_path}"

            set +e
            timeout --signal=TERM --kill-after=30s 5400s \
              python -m scripts.run_scratch_config_cached \
                --cache-data /tmp/cache/stage2_uint8.npy \
                --cache-index /tmp/cache/stage2_index.csv \
                --config "${config_path}" \
                --membership manifests/splits/SPLIT-007_original_tuning.csv \
                --output "${result_path}" \
                --checkpoint "/tmp/checkpoints/${trial_id}.pt" \
                --workers 2 \
                --stage bayesian
            exit_code=$?
            set -e

            if [ ! -f "${result_path}" ]; then
              python -m scripts.record_frozen_config_failure \
                --config "${config_path}" \
                --output "${result_path}" \
                --stage bayesian \
                --exit-code "${exit_code}"
            fi

            git add "${config_path}" "${result_path}"
            git commit -m "Record ${trial_id} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          done
      - name: Aggregate Stage 2 and freeze top five
        run: |
          python -m scripts.aggregate_scratch_stage2 \
            --results-root outputs/metrics/scratch_stage2_trials \
            --output outputs/metrics/scratch_stage2_results.json
          python -m scripts.select_scratch_top5 \
            --stage1-results outputs/metrics/scratch_stage1_results.json \
            --stage2-results outputs/metrics/scratch_stage2_results.json \
            --output configs/sweeps/scratch_top5_source_gate.json
          git add outputs/metrics/scratch_stage2_results.json configs/sweeps/scratch_top5_source_gate.json
          git commit -m "Freeze Stage 2 aggregate and source-gate candidates [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Validate complete Stage 2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stage2 = json.loads(Path("outputs/metrics/scratch_stage2_results.json").read_text())
          top5 = json.loads(Path("configs/sweeps/scratch_top5_source_gate.json").read_text())
          assert stage2["trial_count"] == 30
          assert len(stage2["results"]) == 30
          assert len(top5["candidate_ids"]) == 5
          print("STAGE2_COMPLETE=PASS")
          print("success_count=", stage2["success_count"])
          print("failure_count=", stage2["failure_count"])
          print("top5=", top5["candidate_ids"])
          PY
