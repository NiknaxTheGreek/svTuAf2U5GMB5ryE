name: MonReader V2 Phase 11B hand reconstruction v2

on:
  push:
    branches: ["phase/v2-11b-hand-reconstruction-v2"]
    paths:
      - ".github/workflows/v2_phase11b_hand_reconstruction_v2.yml"
      - "configs/SECONDARY_HAND_ARM_RECONSTRUCTION_V2.json"
      - "protocol/SECONDARY_HAND_ARM_RECONSTRUCTION_V2.md"
      - "scripts/develop_document_reconstruction_v2.py"
  workflow_dispatch:

permissions:
  contents: write

env:
  DATASET_FILE_ID: 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm
  DATASET_SHA256: 033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f
  HAND_MODEL_SHA256: fbc2a30080c3c557093b5ddfc334698132eb341044ccee322ccf8bcf3607cde1
  LAMA_MODEL_SHA256: 7ba7aa7ac37a4d41fdbbeba3a2af7ead18058552997e3a3cd1a3b2210c9e6b4c
  PYTHONPATH: "."

jobs:
  reconstruct-development-48:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install MediaPipe system runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libgles2

      - name: Install pinned runtime
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install numpy pillow opencv-python-headless transformers huggingface_hub mediapipe==1.0.1 onnxruntime
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          python -m pip install simple-lama-inpainting==0.1.2 --no-deps

      - name: Compile reconstruction v2
        run: |
          set -euo pipefail
          python -m compileall -q \
            scripts/hand_arm_clean_dataset_onnx_tasks_v2.py \
            scripts/develop_video_assisted_inpainting_v2.py \
            scripts/develop_lama_inpainting_v2.py \
            scripts/develop_document_reconstruction_v2.py

      - name: Validate frozen config
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("configs/SECONDARY_HAND_ARM_RECONSTRUCTION_V2.json")
          cfg = json.loads(p.read_text())
          assert cfg["development_population"]["primary_test_images_allowed"] == 0
          assert cfg["source_population"]["classifier_predictions_allowed"] is False
          assert cfg["source_population"]["target_label_allowed_for_retrieval"] is False
          assert cfg["reconstruction"]["real_pixel_gate"] == 0.80
          assert cfg["reconstruction"]["required_fraction_targets_passing"] == 0.90
          print("Frozen v2 config guardrails verified.")
          PY

      - name: Download and verify authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=$DATASET_FILE_ID&export=download&confirm=t" \
            --output /tmp/images.zip
          printf '%s  %s\n' "$DATASET_SHA256" "/tmp/images.zip" | sha256sum --check

      - name: Download and verify MediaPipe hand model
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            --output /tmp/hand_landmarker.task
          printf '%s  %s\n' "$HAND_MODEL_SHA256" "/tmp/hand_landmarker.task" | sha256sum --check

      - name: Download and verify pinned LaMa model
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://github.com/enesmsahin/simple-lama-inpainting/releases/download/v0.1.0/big-lama.pt" \
            --output /tmp/big-lama.pt
          printf '%s  %s\n' "$LAMA_MODEL_SHA256" "/tmp/big-lama.pt" | sha256sum --check

      - name: Run document-aware reconstruction v2 on frozen development 48
        run: |
          set -euo pipefail
          rm -rf /tmp/hand-reconstruction-v2
          python -m scripts.develop_document_reconstruction_v2 \
            --archive /tmp/images.zip \
            --manifest manifests/datasets/DATA-001.csv \
            --st-membership manifests/splits/ST.csv \
            --sample results/secondary/perturbation_dev/development_sample.csv \
            --config configs/SECONDARY_HAND_ARM_RECONSTRUCTION_V2.json \
            --hand-model /tmp/hand_landmarker.task \
            --lama-model /tmp/big-lama.pt \
            --output-dir /tmp/hand-reconstruction-v2
          sha256sum \
            /tmp/hand-reconstruction-v2/summary.json \
            /tmp/hand-reconstruction-v2/records.json \
            /tmp/hand-reconstruction-v2/qa/*

      - name: Upload full reconstruction v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-phase11b-hand-reconstruction-v2-dev48
          path: /tmp/hand-reconstruction-v2
          compression-level: 1
          retention-days: 90
          if-no-files-found: error

      - name: Publish compact reconstruction v2 evidence
        run: |
          set -euo pipefail
          mkdir -p results/secondary/hand_reconstruction_v2_dev48
          cp /tmp/hand-reconstruction-v2/summary.json results/secondary/hand_reconstruction_v2_dev48/
          cp /tmp/hand-reconstruction-v2/records.json results/secondary/hand_reconstruction_v2_dev48/
          cp /tmp/hand-reconstruction-v2/qa/*.review.jpg.b64.txt results/secondary/hand_reconstruction_v2_dev48/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/secondary/hand_reconstruction_v2_dev48
          if git diff --cached --quiet; then
            echo "No compact evidence changes; deterministic rerun matches committed evidence."
          else
            git commit -m "Phase 11B: publish hand reconstruction v2 dev48 [skip ci]"
            git fetch origin phase/v2-11b-hand-reconstruction-v2
            git rebase origin/phase/v2-11b-hand-reconstruction-v2
            git push origin HEAD:phase/v2-11b-hand-reconstruction-v2
          fi
