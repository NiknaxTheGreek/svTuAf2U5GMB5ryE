name: Temporal order audit

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/temporal-order-audit.yml"
      - "scripts/temporal_order_audit.py"

permissions:
  contents: write

jobs:
  temporal-order:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow numpy

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          unzip -t data/images.zip >/dev/null
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Compare filename order with random shuffles
        run: |
          rm -rf raw_temporal_audit
          python scripts/temporal_order_audit.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --out-dir raw_temporal_audit

      - name: Commit temporal audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_temporal_audit/
          if git diff --cached --quiet; then
            echo "No temporal audit changes."
          else
            git commit -m "Record temporal order versus shuffle audit"
            git push origin HEAD:raw-eda-scratch
          fi
