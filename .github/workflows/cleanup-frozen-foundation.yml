          mkdir -p "$KEEP"

          keep() {
            for p in "$@"; do
              if [ ! -e "$p" ]; then
                echo "Required keep-path missing: $p" >&2
                exit 1
              fi
              mkdir -p "$KEEP/$(dirname "$p")"
              cp -a "$p" "$KEEP/$p"
