ame_manifest.csv             raw_d3_d4_split/d4_frame_manifest.csv             raw_d3_d4_split/dedup_frame_audit.csv             raw_d3_d4_split/d3_d4_split_summary.json             raw_d3_d4_split/d3_d4_split_receipt.json             raw_feature_abc/abc_original_feature_analysis.json             raw_feature_abc/feature_associations.csv             raw_visual_variability/original_variability_summary.json             scripts/raw_dataset_inventory.py             scripts/dataset_audit.py             scripts/reconstruct_source_groups.py             scripts/temporal_order_audit.py             scripts/perceptual_similarity_audit.py             scripts/targeted_cross_split_ssim.py             scripts/session_similarity_audit.py             scripts/session_cluster_screen.py             scripts/render_all_session_candidates.py             scripts/full_session_candidate_review.py             scripts/finalize_environment_groups.py             scripts/global_dedup_groups.py             scripts/build_d2_environment_split.py             scripts/build_d3_d4_dedup_manifests.py             scripts/original_visual_variability.py             scripts/original_feature_abc.py

