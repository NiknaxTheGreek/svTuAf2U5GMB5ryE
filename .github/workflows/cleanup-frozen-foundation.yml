name: Clean MonReader to frozen D1-D4 foundation

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - '.github/workflows/cleanup-frozen-foundation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch
          fetch-depth: 0
      - name: Run verified cleanup
        run: bash scripts/cleanup_to_frozen_foundation.sh

# retry-after-preserving-workflows
