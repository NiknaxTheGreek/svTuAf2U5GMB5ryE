name: MonReader V2 O visual diagnostics

on:
  push:
    branches: ["phase/v2-04-scratch-o"]
    paths:
      - ".github/workflows/v2_o_visual_diagnostics.yml"
      - "scripts/extract_o_visual_diagnostics.py"

permissions:
  contents: read

env:
  DATASET_FILE_ID: 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm
  DATASET_SHA256: 033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install pinned diagnostic runtime
        run: |
          set -euo pipefail
          python -m pip install Pillow==12.3.0
      - name: Compile diagnostic
        run: |
          set -euo pipefail
          python -m compileall -q scripts/extract_o_visual_diagnostics.py
      - name: Download and verify authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "https://drive.usercontent.google.com/download?id=$DATASET_FILE_ID&export=download&confirm=t" --output /tmp/images.zip
          printf '%s  %s\n' "$DATASET_SHA256" "/tmp/images.zip" | sha256sum --check
      - name: Extract frozen Best-O visual diagnostics
        run: |
          set -euo pipefail
          python scripts/extract_o_visual_diagnostics.py --archive /tmp/images.zip --manifest manifests/datasets/DATA-001.csv --split manifests/splits/O.csv --error-cases results/scratch/O/best_o_error_cases.csv --output-dir /tmp/diagnostics
      - name: Upload visual diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-o-visual-diagnostics
          path: /tmp/diagnostics/
          if-no-files-found: error
          retention-days: 90
