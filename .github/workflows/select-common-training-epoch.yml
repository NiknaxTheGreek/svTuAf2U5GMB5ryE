name: Select common D1-D4 training epoch

on:
  push:
    branches: [raw-eda-scratch]
    paths:
      - "scripts/select_common_training_epoch.py"
      - ".github/workflows/select-common-training-epoch.yml"
      - "raw_model_selection/d2_model_selection_frame_manifest.csv"
      - "raw_model_selection/model_selection_protocol.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow pandas scikit-learn
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Syntax check
        run: python -m py_compile scripts/select_common_training_epoch.py

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          echo "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f  data/images.zip" | sha256sum -c -
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Select common epoch on D2 development only
        run: |
          rm -rf raw_epoch_selection
          python scripts/select_common_training_epoch.py \
            --dataset-root data/extracted \
            --manifest raw_model_selection/d2_model_selection_frame_manifest.csv \
            --protocol raw_model_selection/model_selection_protocol.json \
            --archive data/images.zip \
            --out-dir raw_epoch_selection
          cat raw_epoch_selection/epoch_selection.json
          cat raw_epoch_selection/epoch_selection_receipt.json

      - name: Commit epoch-selection receipts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_epoch_selection/
          if git diff --cached --quiet; then
            echo "No epoch-selection changes."
          else
            git commit -m "Lock common D1-D4 training epoch"
            git pull --rebase origin raw-eda-scratch
            git push origin HEAD:raw-eda-scratch
          fi
