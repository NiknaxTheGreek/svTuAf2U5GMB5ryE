name: Phase 5 Stage 1 resume-safe random search

on:
  push:
    branches: ["phase/05-scratch-original"]

permissions:
  contents: write

jobs:
  stage1:
    if: github.actor != 'github-actions[bot]' && (github.event.head_commit.message == 'Execute Stage 1 resume search' || github.event.head_commit.message == 'Resume Stage 1 resume search')
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install CPU execution dependencies once
        run: |
          python -m pip install numpy==2.3.5 Pillow==12.3.0 PyYAML==6.0.3 scikit-learn==1.9.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
      - name: Verify frozen Stage 1 definition
        run: |
          python -m scripts.generate_scratch_stage1 --output /tmp/stage1-regenerated.json
          python - <<'PY'
          import json
          from pathlib import Path
          from src.tuning import validate_stage1_payload
          regenerated = json.loads(Path("/tmp/stage1-regenerated.json").read_text())
          frozen = json.loads(Path("configs/sweeps/scratch_stage1_random.json").read_text())
          validate_stage1_payload(frozen)
          assert regenerated == frozen, "Frozen Stage-1 values differ from deterministic regeneration"
          print("STAGE1_DEFINITION=PASS")
          PY
          test -f manifests/splits/SPLIT-007_original_tuning.csv
      - name: Verify Git LFS archive and build exact cache
        run: |
          set -euo pipefail
          test -f data/images.zip
          printf '%s  %s\n' \
            "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f" \
            "data/images.zip" | sha256sum --check
          unzip -q data/images.zip -d /tmp/monreader
          mkdir -p /tmp/cache
          python -m scripts.build_scratch_cache \
            --image-root /tmp/monreader \
            --output-data /tmp/cache/stage1_uint8.npy \
            --output-index /tmp/cache/stage1_index.csv
      - name: Execute or resume 40 frozen Stage 1 trials
        env:
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          set -euo pipefail
          mkdir -p outputs/metrics/scratch_stage1_trials /tmp/checkpoints
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for trial_index in $(seq 1 40); do
            printf -v trial_id "stage1-%03d" "$trial_index"
            result_path="outputs/metrics/scratch_stage1_trials/$trial_id.json"

            if [ -f "$result_path" ]; then
              echo "Skipping committed $trial_id"
              continue
            fi

            echo "=== START $trial_id ==="
            set +e
            timeout --signal=TERM --kill-after=30s 19800s \
              python -m scripts.run_scratch_trial_cached \
                --cache-data /tmp/cache/stage1_uint8.npy \
                --cache-index /tmp/cache/stage1_index.csv \
                --trial-config configs/sweeps/scratch_stage1_random.json \
                --trial-id "$trial_id" \
                --output "$result_path" \
                --checkpoint "/tmp/checkpoints/$trial_id.pt" \
                --workers 2
            exit_code=$?
            set -e

            if [ ! -f "$result_path" ]; then
              python -m scripts.record_scratch_trial_failure \
                --trial-config configs/sweeps/scratch_stage1_random.json \
                --trial-id "$trial_id" \
                --output "$result_path" \
                --exit-code "$exit_code" \
                --failure-type infrastructure_failure \
                --evidence "The frozen trial did not emit a result before the execution process ended; hyperparameters were not changed."
            fi

            python - <<PY
          import json
          from pathlib import Path
          p = json.loads(Path("$result_path").read_text())
          print("RESULT", p["trial_id"], p["status"], p.get("best_validation_f1"), p.get("failure_type"))
          PY

            git add "$result_path"
            git commit -m "Record $trial_id [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "=== SAVED $trial_id ==="
          done
      - name: Aggregate Stage 1 and derive Stage 2 envelope
        run: |
          python -m scripts.aggregate_scratch_stage1 \
            --trial-config configs/sweeps/scratch_stage1_random.json \
            --results-root outputs/metrics/scratch_stage1_trials \
            --output outputs/metrics/scratch_stage1_results.json
          python -m scripts.derive_scratch_stage2 \
            --stage1-results outputs/metrics/scratch_stage1_results.json \
            --output configs/sweeps/scratch_stage2_bayesian.json
      - name: Validate and freeze Stage 1 conclusion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stage1 = json.loads(Path("outputs/metrics/scratch_stage1_results.json").read_text())
          stage2 = json.loads(Path("configs/sweeps/scratch_stage2_bayesian.json").read_text())
          assert stage1["trial_count"] == 40
          assert len(stage1["results"]) == 40
          assert stage1["success_count"] >= 8
          assert len(stage1["top8_trial_ids"]) == 8
          assert stage2["source_stage1_top8"] == stage1["top8_trial_ids"]
          print("STAGE1_COMPLETE=PASS")
          print("success_count=", stage1["success_count"])
          print("failure_count=", stage1["failure_count"])
          print("top8=", stage1["top8_trial_ids"])
          print("stage2_search_space=", stage2["search_space"])
          PY
          git add outputs/metrics/scratch_stage1_results.json configs/sweeps/scratch_stage2_bayesian.json
          git commit -m "Freeze Stage 1 aggregate and Stage 2 envelope [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"
