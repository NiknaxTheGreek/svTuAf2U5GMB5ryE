name: MonReader V2 split construction

on:
  push:
    branches:
      - phase/v2-02-splits
    paths:
      - 'scripts/build_v2_splits.py'
      - '.github/workflows/v2_split_build.yml'

permissions:
  contents: write

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build split manifests twice
        run: |
          python scripts/build_v2_splits.py --manifest manifests/datasets/DATA-001.csv --environment-map manifests/video_environment_map.csv --output-dir /tmp/build1/splits --report /tmp/build1/SPLIT_AUDIT.md
          python scripts/build_v2_splits.py --manifest manifests/datasets/DATA-001.csv --environment-map manifests/video_environment_map.csv --output-dir /tmp/build2/splits --report /tmp/build2/SPLIT_AUDIT.md
          diff -rq /tmp/build1 /tmp/build2

      - name: Publish deterministic split evidence
        run: |
          mkdir -p manifests/splits reports/splits
          cp /tmp/build1/splits/O.csv manifests/splits/O.csv
          cp /tmp/build1/splits/S.csv manifests/splits/S.csv
          cp /tmp/build1/splits/T.csv manifests/splits/T.csv
          cp /tmp/build1/splits/ST.csv manifests/splits/ST.csv
          cp /tmp/build1/splits/SPLIT_SUMMARY.json manifests/splits/SPLIT_SUMMARY.json
          cp /tmp/build1/SPLIT_AUDIT.md reports/splits/SPLIT_AUDIT.md
          sha256sum manifests/splits/*.csv manifests/splits/SPLIT_SUMMARY.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/splits reports/splits
          git commit -m 'Phase 2: publish verified V2 split manifests'
          git push origin HEAD:phase/v2-02-splits

      - name: Remove completed temporary branches
        run: |
          git push origin --delete phase/v2-01-data || true
          git push origin --delete reset/v2-train-test-only || true

      - name: Upload split evidence
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-split-evidence
          path: |
            manifests/splits/
            reports/splits/SPLIT_AUDIT.md
          if-no-files-found: error
          retention-days: 90
