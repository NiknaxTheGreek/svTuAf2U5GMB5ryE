name: Build hand-arm removed ablation dataset

on:
  workflow_dispatch:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/build-hand-arm-cleaned.yml"
      - "scripts/build_hand_arm_removed_dataset.py"

permissions:
  contents: write

jobs:
  build-cleaned:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install gdown pillow numpy opencv-python-headless

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted data/hand_arm_cleaned
          mkdir -p data/extracted data/hand_arm_cleaned
          unzip -q data/images.zip -d data/extracted

      - name: Build cleaned ablation dataset and feature comparison
        run: |
          rm -rf raw_hand_arm_ablation
          mkdir -p raw_hand_arm_ablation
          python scripts/build_hand_arm_removed_dataset.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --clean-root data/hand_arm_cleaned             --out-dir raw_hand_arm_ablation

      - name: Validate cleaned image count
        run: |
          test "$(find data/hand_arm_cleaned -type f -iname '*.jpg' | wc -l)" = "2989"

      - name: Package cleaned dataset
        run: |
          tar -cf hand_arm_cleaned_dataset.tar -C data hand_arm_cleaned
          sha256sum hand_arm_cleaned_dataset.tar | tee raw_hand_arm_ablation/hand_arm_cleaned_dataset.sha256
          stat -c '%s' hand_arm_cleaned_dataset.tar | tee raw_hand_arm_ablation/hand_arm_cleaned_dataset_bytes.txt

      - name: Commit manifests and EDA outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_hand_arm_ablation/
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Record hand-arm ablation dataset metadata and feature audit"
            git pull --rebase origin raw-eda-scratch
            git push origin HEAD:raw-eda-scratch
          fi

      - name: Upload cleaned dataset
        uses: actions/upload-artifact@v4
        with:
          name: hand-arm-cleaned-dataset
          path: hand_arm_cleaned_dataset.tar
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

      - name: Upload QA and manifests
        uses: actions/upload-artifact@v4
        with:
          name: hand-arm-cleaned-qa
          path: raw_hand_arm_ablation/
          retention-days: 90
          if-no-files-found: error
