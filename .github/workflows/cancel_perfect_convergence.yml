name: Cancel perfect convergence diagnostic

on:
  push:
    branches: ["experiment/phase5-perfect-convergence"]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'Cancel perfect convergence diagnostic'
    runs-on: ubuntu-latest
    steps:
      - name: Cancel active convergence run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "36602495945"
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer ${GH_TOKEN}"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/cancel"
