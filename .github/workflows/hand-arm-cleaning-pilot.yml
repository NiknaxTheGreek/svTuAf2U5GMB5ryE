name: Hand arm cleaning pilot

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/hand-arm-cleaning-pilot.yml"
      - "scripts/hand_arm_clean_dataset.py"

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow numpy opencv-python-headless torch torchvision transformers huggingface_hub mediapipe schp

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Run 12-image pilot
        run: |
          rm -rf hand_clean_pilot
          mkdir -p hand_clean_pilot/cleaned hand_clean_pilot/reports
          python scripts/hand_arm_clean_dataset.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --out-root hand_clean_pilot/cleaned             --report hand_clean_pilot/reports/cleaning_report.csv             --limit 12

      - name: Build before-after contact sheet
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv
          from PIL import Image, ImageOps, ImageDraw, ImageFont
          report=Path("hand_clean_pilot/reports/cleaning_report.csv")
          with report.open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          root=Path("data/extracted")
          out=Path("hand_clean_pilot")
          cell=(216,384); gap=10; label_h=32
          canvas=Image.new("RGB",(2*cell[0]+3*gap,len(rows)*(cell[1]+label_h+gap)+gap),"white")
          draw=ImageDraw.Draw(canvas); font=ImageFont.load_default()
          for i,r in enumerate(rows):
              src=root/r["path"]
              if not src.exists(): src=root/"images"/r["path"]
              dst=Path(r["cleaned_path"])
              y=gap+i*(cell[1]+label_h+gap)
              for col,p in enumerate([src,dst]):
                  with Image.open(p) as im:
                      thumb=ImageOps.fit(im.convert("RGB"),cell,method=Image.Resampling.BILINEAR)
                  x=gap+col*(cell[0]+gap); canvas.paste(thumb,(x,y))
              draw.text((gap,y+cell[1]+5),f'BEFORE {r["label"]} {r["video_id"]} f{r["frame_num"]}',fill="black",font=font)
              draw.text((2*gap+cell[0],y+cell[1]+5),f'AFTER mask={float(r["mask_fraction"]):.3f}',fill="black",font=font)
          canvas.save(out/"before_after_pilot.jpg",quality=92)
          PY

      - name: Upload pilot
        uses: actions/upload-artifact@v4
        with:
          name: hand-arm-cleaning-pilot
          path: hand_clean_pilot/
          if-no-files-found: error
