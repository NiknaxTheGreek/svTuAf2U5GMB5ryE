name: Build hand-arm removed ablation dataset

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/build-hand-arm-removed-dataset.yml"
      - "scripts/build_hand_arm_removed_dataset.py"

permissions:
  contents: write

jobs:
  build-cleaned:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow numpy opencv-python-headless mediapipe

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Build cleaned hand-arm-removed dataset and compare features
        run: |
          rm -rf derived_hand_arm_removed raw_hand_ablation
          python scripts/build_hand_arm_removed_dataset.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --clean-root derived_hand_arm_removed             --out-dir raw_hand_ablation

      - name: Verify cleaned image count
        run: |
          test "$(find derived_hand_arm_removed -type f -name '*.jpg' | wc -l)" = "2989"

      - name: Commit metadata and QA outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_hand_ablation/
          if git diff --cached --quiet; then
            echo "No metadata changes."
          else
            git commit -m "Record hand-arm ablation dataset metadata and visual feature audit"
            git push origin HEAD:raw-eda-scratch
          fi

      - name: Upload cleaned dataset
        uses: actions/upload-artifact@v4
        with:
          name: monreader-hand-arm-removed-dataset
          path: derived_hand_arm_removed/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Upload hand ablation metadata
        uses: actions/upload-artifact@v4
        with:
          name: monreader-hand-arm-ablation-metadata
          path: raw_hand_ablation/
          if-no-files-found: error
          retention-days: 90
