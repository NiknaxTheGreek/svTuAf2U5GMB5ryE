name: Final repository verification

on:
  push:
    branches-ignore:
      - raw-eda-scratch
    paths:
      - "README.md"
      - "PROJECT_STATE.yaml"
      - "requirements*.txt"
      - "docs/**"
      - "results/**"
      - "splits/**"
      - "scripts/**"
      - ".github/workflows/reproducibility-check.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned core dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify repository locks and governance
        run: |
          python --version
          python scripts/verify_repository.py
