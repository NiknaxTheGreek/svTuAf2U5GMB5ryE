name: Render all session candidates

on:
  push:
    branches: [raw-eda-scratch]
    paths:
      - "scripts/render_all_session_candidates.py"
      - ".github/workflows/render-all-session-candidates.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pillow gdown
      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted && mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted
      - name: Render all 82 candidate links
        run: |
          rm -rf raw_session_candidate_review
          python scripts/render_all_session_candidates.py \
            --inventory raw_audit/image_inventory.csv \
            --candidates raw_session_cluster_screen/strong_session_candidates.csv \
            --image-root data/extracted \
            --out-dir raw_session_candidate_review
      - name: Commit review evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_session_candidate_review/
          git commit -m "Render all session candidate links for conservative review"
          git pull --rebase origin raw-eda-scratch
          git push origin HEAD:raw-eda-scratch
