name: MonReader V2 ST context diagnostics

on:
  push:
    branches: ["phase/v2-07-scratch-st"]
    paths:
      - ".github/workflows/v2_st_context_diagnostics.yml"

permissions:
  actions: read
  contents: write

env:
  DATASET_FILE_ID: 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm
  DATASET_SHA256: 033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f
  PYTHONPATH: "."
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install pinned diagnostic runtime
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 Pillow==12.3.0 scikit-learn==1.9.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
      - name: Compile context-only implementation
        run: |
          set -euo pipefail
          python -m compileall -q src/scratch_v2.py scripts/build_st_context_cache_v2.py scripts/evaluate_st_context_v2.py scripts/preflight_scratch_st_v2.py
      - name: Verify frozen ST split semantics
        run: python -m scripts.preflight_scratch_st_v2

  context-diagnostics:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install pinned diagnostic runtime
        run: |
          set -euo pipefail
          python -m pip install numpy==2.3.5 Pillow==12.3.0 scikit-learn==1.9.1
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.10.0 torchvision==0.25.0
      - name: Download exact frozen Best ST C07 checkpoint from authoritative primary run
        uses: actions/download-artifact@v4
        with:
          name: v2-st-C07
          path: /tmp/c07
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 36815939762
      - name: Download and verify authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://drive.usercontent.google.com/download?id=$DATASET_FILE_ID&export=download&confirm=t" \
            --output /tmp/images.zip
          printf '%s  %s\n' "$DATASET_SHA256" "/tmp/images.zip" | sha256sum --check
      - name: Build 609-row unseen-source early context cache
        run: |
          set -euo pipefail
          mkdir -p /tmp/context
          python -m scripts.build_st_context_cache_v2 \
            --archive /tmp/images.zip \
            --manifest manifests/datasets/DATA-001.csv \
            --membership manifests/splits/ST.csv \
            --role-detail heldout_environment_earlier_context \
            --output-data /tmp/context/unseen_early.npy \
            --output-index /tmp/context/unseen_early_index.csv \
            --output-receipt /tmp/context/unseen_early_receipt.json
      - name: Build 463-row known-source future context cache
        run: |
          set -euo pipefail
          python -m scripts.build_st_context_cache_v2 \
            --archive /tmp/images.zip \
            --manifest manifests/datasets/DATA-001.csv \
            --membership manifests/splits/ST.csv \
            --role-detail known_environment_later_context \
            --output-data /tmp/context/known_future.npy \
            --output-index /tmp/context/known_future_index.csv \
            --output-receipt /tmp/context/known_future_receipt.json
      - name: Evaluate frozen C07 descriptively on context-only populations
        run: |
          set -euo pipefail
          mkdir -p /tmp/context-results
          python -m scripts.evaluate_st_context_v2 \
            --bank configs/MONREADER_FIXED_20_CONFIG_BANK.json \
            --checkpoint /tmp/c07/C07.pt \
            --metadata /tmp/c07/C07.json \
            --unseen-data /tmp/context/unseen_early.npy \
            --unseen-index /tmp/context/unseen_early_index.csv \
            --unseen-receipt /tmp/context/unseen_early_receipt.json \
            --known-data /tmp/context/known_future.npy \
            --known-index /tmp/context/known_future_index.csv \
            --known-receipt /tmp/context/known_future_receipt.json \
            --primary-predictions results/scratch/ST/predictions.csv \
            --output-dir /tmp/context-results
          sha256sum /tmp/context-results/*
      - name: Upload ST context diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-st-context-diagnostics
          path: /tmp/context-results
          compression-level: 1
          if-no-files-found: error
          retention-days: 90
      - name: Publish small context diagnostic evidence
        run: |
          set -euo pipefail
          mkdir -p results/scratch/ST/context_diagnostics
          cp /tmp/context-results/* results/scratch/ST/context_diagnostics/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/scratch/ST/context_diagnostics
          git commit -m "Phase 7: publish frozen ST context diagnostics [skip ci]"
          git push origin "HEAD:phase/v2-07-scratch-st"
