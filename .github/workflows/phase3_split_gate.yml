name: Validate and freeze Phase 3 splits

on:
  push:
    branches: ["phase/03-splits"]

permissions:
  contents: write

jobs:
  split-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
      - name: Install split-gate dependencies
        run: python -m pip install Pillow==12.3.0 PyYAML==6.0.3 pytest==9.0.2 nbformat==5.10.4 nbclient==0.10.4 ipykernel==7.2.0
      - name: Download authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm&export=download&confirm=t"             --output /tmp/images.zip
          printf '%s  %s\n'             "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f"             "/tmp/images.zip" | sha256sum --check
      - name: Recompute decoded-pixel hashes
        run: |
          python - <<'PY'
          import csv
          import hashlib
          from collections import Counter
          from io import BytesIO
          from zipfile import ZipFile
          from PIL import Image

          rows = list(csv.DictReader(open("manifests/datasets/DATA-001.csv", newline="", encoding="utf-8")))
          expected = {row["archive_member"]: row["pixel_sha256"] for row in rows}
          observed = {}
          with ZipFile("/tmp/images.zip") as zf:
              for member in sorted(expected):
                  with Image.open(BytesIO(zf.read(member))) as image:
                      rgb = image.convert("RGB")
                      digest = hashlib.sha256()
                      digest.update(b"RGB\0")
                      digest.update(rgb.width.to_bytes(8, "big", signed=False))
                      digest.update(rgb.height.to_bytes(8, "big", signed=False))
                      digest.update(rgb.tobytes())
                      observed[member] = digest.hexdigest()
          assert observed == expected
          counts = Counter(observed.values())
          assert max(counts.values()) == 1
          print(f"PIXEL_HASH_RECOMPUTE=PASS images={len(observed)} duplicate_groups=0")
          PY
      - name: Build split artifacts
        run: python -m scripts.build_split_manifests --output-root /tmp/generated
      - name: Validate frozen counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads((Path("/tmp/generated/manifests/splits/split_summary.json")).read_text())
          expected = {
              "SPLIT-001": {"train": 2392, "test": 597},
              "SPLIT-002": {"train": 2390, "validation": 298, "test": 301},
              "SPLIT-003": {"train": 2396, "validation": 295, "test": 298},
              "SPLIT-004": {"train": 1635, "validation": 584, "test": 770},
              "SPLIT-005": {"train": 2109, "validation": 265, "test": 283, "excluded_short_video": 332},
              "SPLIT-006": {"train": 1723, "validation": 203, "test": 770, "excluded_short_video": 293},
          }
          for split_id, counts in expected.items():
              assert summary["splits"][split_id]["summary"]["partition_counts"] == counts
          print("SPLIT_COUNTS=PASS")
          PY
      - name: Stage generated split artifacts
        run: |
          rm -rf manifests/splits
          cp -R /tmp/generated/manifests/splits manifests/splits
          cp /tmp/generated/manifests/dataset_split_compatibility.yaml manifests/dataset_split_compatibility.yaml
      - name: Execute split-design notebook
        run: python -m scripts.execute_notebook notebooks/02_split_design.ipynb --in-place
      - name: Run split tests
        run: python -m pytest -q tests/test_splits.py
      - name: Freeze generated split artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/splits manifests/dataset_split_compatibility.yaml notebooks/02_split_design.ipynb
          if git diff --cached --quiet; then
            echo "No generated split changes."
          else
            git commit -m "Freeze Phase 3 split artifacts [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
