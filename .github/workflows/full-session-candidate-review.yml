name: Full session candidate visual review

on:
  push:
    branches: [raw-eda-scratch]
    paths:
      - "scripts/full_session_candidate_review.py"
      - ".github/workflows/full-session-candidate-review.yml"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow
      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted
      - name: Build all candidate review sheets
        run: |
          rm -rf raw_session_candidate_review
          python scripts/full_session_candidate_review.py \
            --inventory raw_audit/image_inventory.csv \
            --candidates raw_session_cluster_screen/strong_session_candidates.csv \
            --image-root data/extracted \
            --out-dir raw_session_candidate_review
      - name: Commit review outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_session_candidate_review/
          git commit -m "Add full session candidate visual review"
          git pull --rebase origin raw-eda-scratch
          git push origin HEAD:raw-eda-scratch
