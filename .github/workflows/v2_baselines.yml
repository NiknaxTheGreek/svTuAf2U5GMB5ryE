name: MonReader V2 baseline audit

on:
  push:
    branches:
      - phase/v2-03-baselines
    paths:
      - 'scripts/audit_candidate_bank_v2.py'
      - 'scripts/run_baselines_v2.py'
      - 'protocol/BASELINE_PROTOCOL_V2.md'
      - '.github/workflows/v2_baselines.yml'

permissions:
  contents: write

env:
  DATASET_FILE_ID: 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm

jobs:
  baseline-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Audit frozen candidate bank before baseline tests
        run: |
          python scripts/audit_candidate_bank_v2.py --bank configs/MONREADER_FIXED_20_CONFIG_BANK.json --json-out /tmp/candidate_bank_audit.json --md-out /tmp/CANDIDATE_BANK_AUDIT.md

      - name: Install pinned baseline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'gdown==5.2.0' 'Pillow==11.0.0' 'numpy==2.1.3' 'scipy==1.14.1' 'scikit-learn==1.5.2' 'scikit-image==0.24.0'

      - name: Download and independently verify official archive
        run: |
          gdown --id "$DATASET_FILE_ID" --output images.zip
          stat --printf='downloaded_bytes=%s\n' images.zip
          sha256sum images.zip

      - name: Run frozen baseline protocol
        run: |
          python scripts/run_baselines_v2.py --archive images.zip --manifest manifests/datasets/DATA-001.csv --split-dir manifests/splits --output-dir /tmp/baselines

      - name: Publish baseline evidence
        run: |
          mkdir -p manifests/audits reports/protocol reports/baselines outputs/baselines
          cp /tmp/candidate_bank_audit.json manifests/audits/CANDIDATE_BANK_AUDIT.json
          cp /tmp/CANDIDATE_BANK_AUDIT.md reports/protocol/CANDIDATE_BANK_AUDIT.md
          cp /tmp/baselines/metrics.csv outputs/baselines/metrics.csv
          cp /tmp/baselines/predictions.csv outputs/baselines/predictions.csv
          cp /tmp/baselines/coefficients.csv outputs/baselines/coefficients.csv
          cp /tmp/baselines/scaler_parameters.csv outputs/baselines/scaler_parameters.csv
          cp /tmp/baselines/BASELINE_SUMMARY.json outputs/baselines/BASELINE_SUMMARY.json
          cp /tmp/baselines/BASELINE_REPORT.md reports/baselines/BASELINE_REPORT.md
          sha256sum outputs/baselines/*
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifests/audits/CANDIDATE_BANK_AUDIT.json reports/protocol/CANDIDATE_BANK_AUDIT.md reports/baselines\n          git add -f outputs/baselines
          git commit -m 'Phase 3: publish candidate-bank audit and frozen baselines'
          git push origin HEAD:phase/v2-03-baselines

      - name: Remove completed Phase-2 branch
        run: git push origin --delete phase/v2-02-splits || true

      - name: Upload baseline evidence
        uses: actions/upload-artifact@v4
        with:
          name: monreader-v2-baseline-evidence
          path: |
            /tmp/candidate_bank_audit.json
            /tmp/CANDIDATE_BANK_AUDIT.md
            /tmp/baselines/
          if-no-files-found: error
          retention-days: 90
