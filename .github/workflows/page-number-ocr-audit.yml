name: Textbook page-number OCR audit

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/page-number-ocr-audit.yml"
      - "scripts/page_number_ocr_audit.py"

permissions:
  contents: write

jobs:
  page-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR engine and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install --upgrade pip
          pip install gdown pillow numpy pytesseract
          tesseract --version

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          unzip -t data/images.zip >/dev/null
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Sample and OCR page-number candidates
        run: |
          rm -rf raw_page_number_audit
          python scripts/page_number_ocr_audit.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --out-dir raw_page_number_audit

      - name: Commit OCR audit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_page_number_audit/
          if git diff --cached --quiet; then
            echo "No OCR audit changes."
          else
            git commit -m "Record textbook page-number OCR audit"
            git push origin HEAD:raw-eda-scratch
          fi
