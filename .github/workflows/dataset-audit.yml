name: MonReader authoritative dataset audit

on:
  push:
    paths:
      - ".github/workflows/dataset-audit.yml"
      - "scripts/dataset_audit.py"
      - "scripts/reconstruct_source_groups.py"
      - "scripts/create_group_split.py"
      - "scripts/run_baseline.py"
      - "splits/source_group_split.csv"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow pandas scipy scikit-learn

      - name: Download authoritative MonReader dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          ls -lh data/images.zip
          python - <<'PY'
          from pathlib import Path
          p=Path("data/images.zip")
          print("downloaded_bytes=", p.stat().st_size)
          expected=939921132
          if p.stat().st_size != expected:
              raise SystemExit(f"Unexpected ZIP size: {p.stat().st_size} != {expected}")
          PY

      - name: Verify ZIP and extract
        run: |
          unzip -t data/images.zip > /tmp/unzip_test.txt
          tail -n 3 /tmp/unzip_test.txt
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted
          find data/extracted -maxdepth 3 -type d | sort | head -100

      - name: Run authoritative byte-level audit
        run: |
          python scripts/dataset_audit.py \
            --root data/extracted \
            --out-dir audit_output \
            --near-threshold 4
          cat audit_output/audit_summary.json

      - name: Reconstruct canonical source groups
        run: |
          python scripts/reconstruct_source_groups.py --inventory audit_output/image_inventory.csv --out-dir source_group_output
          cat source_group_output/source_group_summary.json

      - name: Create leakage-safe source-group split
        run: |
          python scripts/create_group_split.py --source-groups source_group_output/source_groups.csv --frames source_group_output/frames_with_source_group.csv --out-dir split_output
          cat split_output/split_summary.json

      - name: Run train/validation baseline
        run: |
          python scripts/run_baseline.py --dataset-root data/extracted --frames source_group_output/frames_with_source_group.csv --split splits/source_group_split.csv --out-dir baseline_output
          cat baseline_output/baseline_metrics.json

      - name: Record archive checksum
        run: |
          sha256sum data/images.zip | tee audit_output/images_zip_sha256.txt

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: monreader-authoritative-dataset-audit
          path: |
            audit_output/
            source_group_output/
            split_output/
            baseline_output/
          if-no-files-found: error
          retention-days: 30
