name: CI

on:
  push:
    branches: [main, "phase/**"]
  pull_request:
    branches: [main]

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall -q src run_experiment.py tests
      - name: Test
        run: python -m pytest -q
      - name: Synthetic CLI smoke
        run: python run_experiment.py --config configs/base.yaml --device cpu
