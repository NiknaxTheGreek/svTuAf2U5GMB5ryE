name: Step 7 final test preflight

on:
  push:
    paths:
      - ".github/workflows/final-test-preflight.yml"

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow pandas scikit-learn
          pip install torch==2.8.0 torchvision==0.23.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          echo "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f  data/images.zip" | sha256sum -c -
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Download frozen Step 6 checkpoint artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p step6_artifact
          curl --fail --location --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10657705539/zip" \
            -o step6_artifact.zip
          unzip -q step6_artifact.zip -d step6_artifact
          CHECKPOINT="$(find step6_artifact -name best_mobilenetv3_small.pt -print -quit)"
          test -n "$CHECKPOINT"
          cp "$CHECKPOINT" frozen_checkpoint.pt
          echo "49f2256715eb293adb2caaac410b6b4ed7dd6a2c3ba99828504f672a244170f1  frozen_checkpoint.pt" | sha256sum -c -

      - name: Verify final holdout without opening test pixels
        run: |
          python scripts/evaluate_final_test.py --dataset-root data/extracted --split splits/source_group_split.csv --checkpoint frozen_checkpoint.pt --archive data/images.zip --out-dir preflight_output --preflight-only
          cat preflight_output/final_test_preflight.json

      - name: Upload preflight receipt
        uses: actions/upload-artifact@v4
        with:
          name: step7-final-test-preflight
          path: preflight_output/
          if-no-files-found: error
          retention-days: 30
