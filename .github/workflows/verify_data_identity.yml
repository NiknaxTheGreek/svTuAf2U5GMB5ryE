name: Build authoritative data audit
# One-time Phase 2 artifact freeze; removed after successful validation.

on:
  push:
    branches: ["phase/02-data-ingestion"]

permissions:
  contents: write

jobs:
  data-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download authoritative archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm&export=download&confirm=t"             --output /tmp/images.zip
      - name: Build canonical dataset artifacts
        run: python -m scripts.build_dataset_manifest --archive /tmp/images.zip --output-root /tmp/generated
      - name: Validate generated artifacts
        run: |
          python - <<'PY'
          import csv
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile
          import yaml

          root = Path("/tmp/generated")
          manifest = root / "manifests/datasets/DATA-001.csv"
          summary_path = root / "manifests/datasets/DATA-001_summary.json"
          registration_path = root / "manifests/datasets/DATA-001.yaml"

          with manifest.open(newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          with ZipFile("/tmp/images.zip") as zf:
              members = sorted(i.filename for i in zf.infolist() if not i.is_dir())

          assert len(rows) == len(members) == 2989
          assert sorted(row["archive_member"] for row in rows) == members
          assert {row["label"] for row in rows} == {"flip", "notflip"}
          assert {row["supplied_split"] for row in rows} == {"training", "testing"}
          assert all(row["raw_video_id"].isdigit() and len(row["raw_video_id"]) == 4 for row in rows)
          assert all(row["video_id"] == f'{row["label"]}/{row["raw_video_id"]}' for row in rows)
          assert len({(row["video_id"], int(row["frame_number"])) for row in rows}) == len(rows)
          assert all(len(row["file_sha256"]) == 64 and len(row["pixel_sha256"]) == 64 for row in rows)

          digest = hashlib.sha256(manifest.read_bytes()).hexdigest()
          registration = yaml.safe_load(registration_path.read_text(encoding="utf-8"))
          assert registration["manifest"]["sha256"] == digest
          assert registration["manifest"]["row_count"] == len(rows)

          summary = json.loads(summary_path.read_text(encoding="utf-8"))
          assert summary["image_count"] == len(rows)
          assert summary["exact_pixel_duplicate_group_count"] == 0
          print(f"manifest_sha256={digest}")
          print("MANIFEST_INTEGRITY=PASS")
          PY
      - name: Stage generated public artifacts
        run: |
          rm -rf manifests docs/sample_images
          cp -R /tmp/generated/manifests manifests
          mkdir -p docs
          cp -R /tmp/generated/docs/sample_images docs/sample_images
      - name: Execute polished data-audit notebook
        run: python -m scripts.execute_notebook notebooks/01_data_audit.ipynb --in-place
      - name: Re-run component tests
        run: python -m pytest -q
      - name: Commit frozen Phase-2 artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests docs/sample_images notebooks/01_data_audit.ipynb
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
          else
            git commit -m "Freeze canonical dataset artifacts [skip ci]"
            git push
          fi
