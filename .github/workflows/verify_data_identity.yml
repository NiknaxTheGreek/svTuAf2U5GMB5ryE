name: Verify authoritative data identity

on:
  push:
    branches: ["phase/02-data-ingestion"]

jobs:
  verify-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download candidate archive
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2             "https://drive.usercontent.google.com/download?id=1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm&export=download&confirm=t"             --output /tmp/images.zip
      - name: Verify locked identity
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path("/tmp/images.zip")
          expected_size = 939_921_132
          expected_sha256 = "033dd76fa617ba9bcf16d8ca4dcc294a838a6956eae0740f3013e4663805008f"

          size = path.stat().st_size
          h = hashlib.sha256()
          with path.open("rb") as f:
              for chunk in iter(lambda: f.read(8 * 1024 * 1024), b""):
                  h.update(chunk)
          digest = h.hexdigest()

          print(f"filename={path.name}")
          print(f"size={size}")
          print(f"sha256={digest}")

          if size != expected_size:
              raise SystemExit(f"size mismatch: {size} != {expected_size}")
          if digest != expected_sha256:
              raise SystemExit(f"sha256 mismatch: {digest} != {expected_sha256}")
          print("DATA_IDENTITY=PASS")
          PY
      - name: Inspect archive structure
        run: |
          python - <<'PY'
          from collections import Counter
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          archive = "/tmp/images.zip"
          with ZipFile(archive) as zf:
              infos = [i for i in zf.infolist() if not i.is_dir()]

          print(f"file_count={len(infos)}")
          suffixes = Counter(PurePosixPath(i.filename).suffix.lower() for i in infos)
          print("suffix_counts=", dict(sorted(suffixes.items())))

          depth_counts = Counter(len(PurePosixPath(i.filename).parts) for i in infos)
          print("path_depth_counts=", dict(sorted(depth_counts.items())))

          prefix_counts = Counter()
          for i in infos:
              parts = PurePosixPath(i.filename).parts
              prefix_counts["/".join(parts[: min(4, len(parts)-1)])] += 1

          print("top_prefixes:")
          for key, count in prefix_counts.most_common(30):
              print(f"  {count:6d}  {key}")

          print("first_paths:")
          for i in infos[:30]:
              print(f"  {i.filename}")
          print("last_paths:")
          for i in infos[-30:]:
              print(f"  {i.filename}")
          PY
