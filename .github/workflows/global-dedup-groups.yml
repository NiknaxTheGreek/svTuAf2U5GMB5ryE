name: Global near-duplicate grouping audit

on:
  push:
    branches:
      - raw-eda-scratch
    paths:
      - ".github/workflows/global-dedup-groups.yml"
      - "scripts/global_dedup_groups.py"

permissions:
  contents: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: raw-eda-scratch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gdown pillow numpy imagehash scikit-image

      - name: Download authoritative dataset
        run: |
          mkdir -p data
          gdown 1KDQBTbo5deKGCdVV_xIujscn5ImxW4dm -O data/images.zip
          test "$(stat -c%s data/images.zip)" = "939921132"
          rm -rf data/extracted
          mkdir -p data/extracted
          unzip -q data/images.zip -d data/extracted

      - name: Build global confirmed near-duplicate groups
        run: |
          rm -rf raw_global_dedup
          python scripts/global_dedup_groups.py             --inventory raw_audit/image_inventory.csv             --image-root data/extracted             --out-dir raw_global_dedup

      - name: Commit dedup outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f raw_global_dedup/
          if git diff --cached --quiet; then
            echo "No dedup changes."
          else
            git commit -m "Record global near-duplicate groups"
            git push origin HEAD:raw-eda-scratch
          fi
