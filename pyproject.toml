[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "monreader"
version = "0.1.0"
description = "MonReader flip/notflip image-classification project"
requires-python = "==3.13.5"
dependencies = [
  "ipykernel==7.2.0",
  "matplotlib==3.10.8",
  "nbclient==0.10.4",
  "nbformat==5.10.4",
  "numpy==2.3.5",
  "Pillow==12.3.0",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.1",
  "torch==2.10.0",
  "torchvision==0.25.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
